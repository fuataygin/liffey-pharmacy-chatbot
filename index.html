<script>
    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbyErparIvcM8NU2IU9q3rPABEqibVSW9GgTrrTQjRtBJMsl1Mm2AQHaBl2pkTmoUDRLdw/exec";

    const chat = document.getElementById("chat");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
      return message;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) {
        return;
      }

      addMessage(message, "user");

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      const loading = addMessage("Thinking...", "assistant");
      loading.querySelector(".bubble").classList.add("loading");
        

      try {
        // Send request via GET parameter to avoid Google Apps Script CORS issues
        const requestUrl = `${BACKEND_URL}?message=${encodeURIComponent(message)}`;
        const response = await fetch(requestUrl);

        if (!response.ok) {
          throw new Error("Server returned HTTP " + response.status);
        }

        const data = await response.json();
        loading.remove();

        if (data.error) {
          addMessage(
            "Sorry, I couldn't process that request. Error: " + data.error,
            "assistant"
          );
        } else {
          addMessage(
            data.answer || data.reply || "I couldn't produce an answer.",
            "assistant"
          );
        }
      } catch (error) {
        console.error(error);
        loading.remove();
        addMessage(
          "I'm sorry, I couldn't connect to the pharmacy assistant. Please try again.",
          "assistant"
        );
      } finally {
        input.disabled = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
